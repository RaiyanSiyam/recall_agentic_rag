[project]
name = "agentic-rag-live-memory"
version = "0.1.0"
description = "Agentic RAG over Live Data and Memory using MCP tools, parallel query decomposition, verification, and short/long-term memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "mcp>=1.2.0",
    "google-generativeai>=0.8.3",
    "openai>=1.54.0",
    "anthropic>=0.39.0",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
